<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🔮 隐藏星座 · 离谱测一测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #0b0a0f;
            background-image: radial-gradient(circle at 20% 30%, #1e1826 0%, #0b0a0f 80%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 12px 40px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(18, 16, 26, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 56px 56px 40px 40px;
            padding: 28px 22px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(212, 175, 55, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.25);
            transition: 0.3s;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            text-align: center;
            color: #f5e7b0;
            text-shadow: 0 0 15px #b8860b55, 0 2px 0 #7a5c1a;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        h1 small {
            font-size: 1rem;
            background: #2f2740;
            padding: 4px 16px;
            border-radius: 40px;
            color: #d4b87a;
            font-weight: 400;
            letter-spacing: 0;
        }

        .sub {
            text-align: center;
            color: #a3947a;
            font-size: 0.95rem;
            margin-bottom: 24px;
            border-bottom: 1px dashed #3d334a;
            padding-bottom: 16px;
        }

        /* 问题区 */
        .question-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 6px;
        }

        .q-item {
            background: rgba(30, 26, 42, 0.7);
            border-radius: 30px;
            padding: 14px 20px 16px;
            border-left: 4px solid #b8944b;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }

        .q-label {
            display: flex;
            justify-content: space-between;
            color: #dfd0b0;
            font-weight: 500;
            font-size: 1rem;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }
        .q-label span {
            background: #2f263b;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #c6b088;
        }

        .q-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 12px;
            margin-top: 6px;
        }
        .q-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1f1a2a;
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            color: #cdbc9c;
            font-size: 0.9rem;
            border: 1px solid #3f334f;
            transition: 0.15s;
            cursor: pointer;
        }
        .q-options input[type="radio"] {
            accent-color: #d4af37;
            width: 16px;
            height: 16px;
            margin-right: 2px;
        }
        .q-options label:has(input:checked) {
            background: #2f263b;
            border-color: #d4af37;
            color: #f5e7b0;
            box-shadow: 0 0 8px #d4af3740;
        }

        /* 个人信息 */
        .info-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 14px;
            background: #14121c;
            padding: 18px 20px;
            border-radius: 40px;
            margin: 16px 0 8px;
            border: 1px solid #3a2d44;
        }
        .info-field {
            flex: 1 0 160px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #b7a586;
        }
        .info-field label {
            font-size: 0.9rem;
            min-width: 64px;
            font-weight: 400;
        }
        .info-field input, .info-field select {
            background: #242033;
            border: 1px solid #4f3f5a;
            border-radius: 40px;
            padding: 8px 12px;
            color: #f0e3c6;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            transition: 0.2s;
        }
        .info-field input:focus, .info-field select:focus {
            border-color: #d4af37;
            box-shadow: 0 0 10px #d4af3740;
        }
        .info-field input::placeholder {
            color: #6a5e72;
        }

        .btn-test {
            background: linear-gradient(145deg, #d4af37, #b58d2c);
            border: none;
            color: #0b0a0f;
            font-weight: 700;
            font-size: 1.6rem;
            padding: 18px 0;
            border-radius: 80px;
            width: 100%;
            margin: 18px 0 12px;
            letter-spacing: 2px;
            box-shadow: 0 8px 0 #6b4f1a, 0 12px 30px #d4af3740;
            transition: 0.08s linear;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-test:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #6b4f1a;
        }

        /* 结果卡片 */
        .result-area {
            margin-top: 28px;
            border-top: 2px solid #3d334a;
            padding-top: 20px;
            display: none;
            animation: fadeGlow 0.5s ease;
        }
        @keyframes fadeGlow {
            0% { opacity: 0.2; filter: blur(4px); }
            100% { opacity: 1; filter: blur(0); }
        }

        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
            background: #14121c;
            padding: 18px 16px;
            border-radius: 40px;
            border: 1px solid #4b3d53;
            margin-bottom: 20px;
        }
        .score-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .score-item .label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #c7b696;
        }
        .progress-bg {
            width: 100%;
            height: 10px;
            background: #2f273a;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4af37, #f5d472);
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2);
        }

        .zodiac-composition {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px 28px;
            background: #1a1724;
            padding: 16px 12px;
            border-radius: 60px;
            margin: 12px 0 18px;
            border: 1px solid #4f3f5a;
        }
        .zodiac-badge {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #f5e7b0;
        }
        .zodiac-badge span {
            font-size: 0.9rem;
            font-weight: 400;
            color: #b7a07b;
        }

        .dimension-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            background: #14121c;
            padding: 16px 12px;
            border-radius: 40px;
            margin: 14px 0;
            border: 1px solid #3d334a;
        }
        .dimension-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }
        .dimension-item .title {
            font-size: 0.8rem;
            color: #a28d70;
            letter-spacing: 0.5px;
        }
        .dimension-item .value {
            font-size: 1.7rem;
            font-weight: 700;
            color: #f5d472;
        }

        .job-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0 18px;
            justify-content: center;
        }
        .job-card {
            background: #1e1a2a;
            padding: 8px 18px 8px 14px;
            border-radius: 60px;
            border-left: 6px solid #b8944b;
            color: #e6d7b5;
            font-size: 1rem;
            box-shadow: 0 2px 8px #00000055;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .job-card .emoji {
            font-size: 1.5rem;
        }

        .social-scene {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #12101b;
            padding: 14px 16px;
            border-radius: 36px;
            border: 1px solid #3d334a;
            margin: 14px 0 22px;
        }
        .scene-item {
            display: flex;
            align-items: baseline;
            gap: 6px 12px;
            flex-wrap: wrap;
            font-size: 1rem;
            border-bottom: 1px dashed #332b3d;
            padding: 6px 0;
        }
        .scene-item:last-child {
            border: none;
        }
        .scene-item .tag {
            background: #2f263b;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #d4b87a;
        }
        .scene-item .desc {
            color: #d1c3a8;
        }

        .footer-share {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin: 24px 0 6px;
        }
        .footer-share .big-text {
            font-size: 1.7rem;
            font-weight: 700;
            color: #f5e7b0;
            text-shadow: 0 0 20px #b8860b66;
            letter-spacing: 1px;
        }
        .footer-share .sub-text {
            color: #b7a07b;
            font-size: 1rem;
            background: #1f1a2a;
            padding: 6px 24px;
            border-radius: 60px;
            border: 1px solid #4f3f5a;
        }

        .highlight-gold {
            color: #f5d472;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container { padding: 16px; }
            h1 { font-size: 1.8rem; flex-wrap: wrap; }
            .score-grid { grid-template-columns: 1fr 1fr; }
            .info-row { flex-direction: column; }
            .info-field { flex: 1 1 auto; }
            .q-options label { font-size: 0.8rem; padding: 4px 12px; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>🔮 隐藏星座 <small>· 离谱测</small></h1>
    <div class="sub">⚡ 7个灵魂拷问 · 暴露你的第二人格</div>

    <!-- 问题区域 7题 -->
    <div class="question-grid" id="questionArea">
        <!-- 由 js 动态生成 7 个问题 -->
    </div>

    <!-- 个人信息 -->
    <div class="info-row">
        <div class="info-field"><label>📅 出生</label><input type="date" id="birthDate" value="2000-01-01"></div>
        <div class="info-field"><label>⚥ 性别</label>
            <select id="genderSelect"><option value="男">男</option><option value="女">女</option><option value="其他">其他</option></select>
        </div>
        <div class="info-field"><label>🕒 时间</label><input type="time" id="birthTime" value="12:00"></div>
        <div class="info-field"><label>📍 地点</label><input type="text" id="birthPlace" placeholder="城市" value="北京"></div>
    </div>

    <button class="btn-test" id="startTestBtn">✨ 开始测试 · 窥探灵魂 ✨</button>

    <!-- 结果区域 -->
    <div class="result-area" id="resultArea">
        <!-- 分数卡片 理性/感性/神秘/社交 -->
        <div class="score-grid" id="scoreGrid"></div>

        <!-- 星座组成 3个 -->
        <div class="zodiac-composition" id="zodiacComposition"></div>

        <!-- 暴走/粗心 vs 冷静/谨慎 维度 -->
        <div class="dimension-row" id="dimensionRow"></div>

        <!-- 离谱职业推荐 -->
        <div class="job-list" id="jobList"></div>

        <!-- 社交人格 3场景 -->
        <div class="social-scene" id="socialScene"></div>

        <!-- 底部引导 -->
        <div class="footer-share">
            <div class="big-text">📸 截图 @ 你的朋友 来比一比</div>
            <div class="sub-text">Know yourself 😎  (墨镜脸)</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- 问题库 (7题) ----------
        const QUESTIONS = [
            { id: 'q1', text: '周末朋友约你出门，你第一反应？', options: ['直接拒绝', '考虑半小时', '立刻答应', '先问有哪些人'] },
            { id: 'q2', text: '看到有人插队，你会？', options: ['大声制止', '内心翻白眼', '拍照发朋友圈', '默默走开'] },
            { id: 'q3', text: '最害怕什么？', options: ['孤独', '无聊', '被误解', '失败'] },
            { id: 'q4', text: '你更擅长？', options: ['逻辑分析', '共情安慰', '脑洞大开', '组织协调'] },
            { id: 'q5', text: '别人对你的第一印象？', options: ['高冷', '热情', '神秘', '靠谱'] },
            { id: 'q6', text: '深夜你常做的事？', options: ['刷手机', '思考人生', '听歌发呆', '写小作文'] },
            { id: 'q7', text: '遇到杠精，你？', options: ['怼回去', '拉黑', '看戏', '哲学说服'] }
        ];

        // ---------- DOM 引用 ----------
        const questionArea = document.getElementById('questionArea');
        const resultArea = document.getElementById('resultArea');
        const startBtn = document.getElementById('startTestBtn');

        // 生成问题
        function renderQuestions() {
            let html = '';
            QUESTIONS.forEach((q, idx) => {
                html += `<div class="q-item">
                    <div class="q-label"><span>Q${idx+1}</span> ${q.text}</div>
                    <div class="q-options">`;
                q.options.forEach(opt => {
                    const val = opt.replace(/\s/g, '');
                    html += `<label><input type="radio" name="${q.id}" value="${val}"> ${opt}</label>`;
                });
                html += `</div></div>`;
            });
            questionArea.innerHTML = html;
        }
        renderQuestions();

        // ---------- 核心计算 ----------
        function getSelectedAnswers() {
            const answers = {};
            QUESTIONS.forEach(q => {
                const el = document.querySelector(`input[name="${q.id}"]:checked`);
                answers[q.id] = el ? el.value : null;
            });
            return answers;
        }

        // 模拟太阳/月亮/上升 (根据出生日期、时间、地点) 这里做趣味映射
        function calcZodiac(birthDate, birthTime, gender) {
            if (!birthDate) return { sun: '天蝎', moon: '双鱼', rising: '水瓶' };
            const d = new Date(birthDate);
            const month = d.getMonth()+1, day = d.getDate();
            // 简单太阳星座
            const sunSigns = ['摩羯','水瓶','双鱼','白羊','金牛','双子','巨蟹','狮子','处女','天秤','天蝎','射手','摩羯'];
            let sunIdx = 0;
            if ((month===1 && day>=20) || (month===2 && day<=18)) sunIdx=1;
            else if ((month===2 && day>=19) || (month===3 && day<=20)) sunIdx=2;
            else if ((month===3 && day>=21) || (month===4 && day<=19)) sunIdx=3;
            else if ((month===4 && day>=20) || (month===5 && day<=20)) sunIdx=4;
            else if ((month===5 && day>=21) || (month===6 && day<=21)) sunIdx=5;
            else if ((month===6 && day>=22) || (month===7 && day<=22)) sunIdx=6;
            else if ((month===7 && day>=23) || (month===8 && day<=22)) sunIdx=7;
            else if ((month===8 && day>=23) || (month===9 && day<=22)) sunIdx=8;
            else if ((month===9 && day>=23) || (month===10 && day<=23)) sunIdx=9;
            else if ((month===10 && day>=24) || (month===11 && day<=22)) sunIdx=10;
            else if ((month===11 && day>=23) || (month===12 && day<=21)) sunIdx=11;
            else sunIdx=12;
            const sun = sunSigns[sunIdx] || '天蝎';

            // 根据性别和日期hash决定月亮/上升
            const hash = (birthDate+gender).length + month*day + (birthTime? birthTime.length: 0);
            const moonList = ['双鱼','巨蟹','天蝎','处女','金牛','摩羯','水瓶','天秤','双子','狮子','射手','白羊'];
            const risingList = ['水瓶','天秤','双子','狮子','射手','白羊','金牛','处女','摩羯','巨蟹','天蝎','双鱼'];
            const moon = moonList[(hash+3) % moonList.length];
            const rising = risingList[(hash+7) % risingList.length];
            return { sun, moon, rising };
        }

        // 生成结果数据
        function generateResult(answers, birthDate, gender, birthTime, place) {
            // 根据答案计算四个指数  (0~100)
            let rational = 40, emotional = 40, mystic = 40, social = 40;
            // 每个问题对指数有影响
            const ansArr = Object.values(answers).filter(v => v!==null);
            ansArr.forEach((val, idx) => {
                const hash = (val.length + idx) % 10;
                rational += (hash % 5) * 2 + 1;
                emotional += (hash % 7) * 1.5 + 1;
                mystic += (hash % 6) * 2;
                social += (hash % 8) * 1.2 + 2;
            });
            // 加入性别、时间偏移
            if (gender === '女') { emotional += 12; rational -= 4; }
            else if (gender === '男') { rational += 10; emotional -= 2; }
            if (birthTime && birthTime.length > 0) { mystic += 15; social += 5; }
            // 限定范围
            rational = Math.min(98, Math.max(12, rational));
            emotional = Math.min(98, Math.max(12, emotional));
            mystic = Math.min(98, Math.max(12, mystic));
            social = Math.min(98, Math.max(12, social));

            // 星座组成 (根据出生日期推算)
            const zodiac = calcZodiac(birthDate, birthTime, gender);
            // 三个星座 + 百分比 (基于指数)
            const p1 = Math.round(rational * 0.3 + emotional * 0.2 + 20);
            const p2 = Math.round(emotional * 0.3 + mystic * 0.2 + 20);
            const p3 = Math.round(social * 0.3 + mystic * 0.2 + 10);
            const comp = [
                { name: zodiac.sun, pct: Math.min(95, p1) },
                { name: zodiac.moon, pct: Math.min(95, p2) },
                { name: zodiac.rising, pct: Math.min(95, p3) }
            ].sort((a,b)=>b.pct-a.pct);

            // 维度对比 (暴走/粗心 VS 冷静/谨慎) 基于理性&感性
            const hot = Math.min(95, Math.round((emotional + social) * 0.45 + 10));
            const cold = Math.min(95, Math.round((rational + mystic) * 0.45 + 10));

            // 离谱职业
            const jobs = [
                { emoji: '🎙️', name: '深夜电台主播', desc: '专治emo，顺便把听众聊得更emo' },
                { emoji: '⚔️', name: '职业杠精', desc: '抬杠界VIP，辩到你怀疑人生' },
                { emoji: '🧙', name: '玄学占卜师', desc: '用塔罗牌告诉你明天吃啥' }
            ];

            // 社交人格 (3个场景)
            const scenes = [
                { tag: '👂 朋友emo', desc: '你：先递纸巾，然后开始分析“你为什么会难过”' },
                { tag: '⚖️ 被人冤枉', desc: '你：冷笑一声，开始罗列时间线证据' },
                { tag: '🤡 遇到蠢人', desc: '你：深吸一口气，内心默念“尊重物种多样性”' }
            ];

            return {
                scores: { rational, emotional, mystic, social },
                comp,
                hot, cold,
                jobs,
                scenes,
                zodiac
            };
        }

        // ---------- 渲染结果 ----------
        function renderResult(data) {
            const { scores, comp, hot, cold, jobs, scenes } = data;

            // 1. 分数卡片
            const grid = document.getElementById('scoreGrid');
            const labels = ['理性指数', '感性指数', '神秘指数', '社交指数'];
            const keys = ['rational', 'emotional', 'mystic', 'social'];
            grid.innerHTML = keys.map((k, i) => `
                <div class="score-item">
                    <div class="label"><span>${labels[i]}</span><span>${Math.round(scores[k])}%</span></div>
                    <div class="progress-bg"><div class="progress-fill" style="width: ${scores[k]}%;"></div></div>
                </div>
            `).join('');

            // 2. 星座组成
            const compDiv = document.getElementById('zodiacComposition');
            compDiv.innerHTML = comp.map(c => `
                <div class="zodiac-badge">${c.name} <span>${c.pct}%</span></div>
            `).join('');

            // 3. 维度对比
            const dimRow = document.getElementById('dimensionRow');
            dimRow.innerHTML = `
                <div class="dimension-item"><span class="title">🔥 暴走/粗心</span><span class="value">${hot}%</span></div>
                <div class="dimension-item"><span class="title">🧊 冷静/谨慎</span><span class="value">${cold}%</span></div>
                <div class="dimension-item"><span class="title">⚡ 反差值</span><span class="value">${Math.abs(hot-cold)}</span></div>
            `;

            // 4. 离谱职业
            const jobDiv = document.getElementById('jobList');
            jobDiv.innerHTML = jobs.map(j => `
                <div class="job-card"><span class="emoji">${j.emoji}</span> ${j.name} <span style="color:#b7a07b;font-size:0.8rem;">· ${j.desc}</span></div>
            `).join('');

            // 5. 社交人格
            const sceneDiv = document.getElementById('socialScene');
            sceneDiv.innerHTML = scenes.map(s => `
                <div class="scene-item"><span class="tag">${s.tag}</span><span class="desc">${s.desc}</span></div>
            `).join('');

            // 显示结果
            resultArea.style.display = 'block';
            window.scrollTo({ top: resultArea.offsetTop - 20, behavior: 'smooth' });
        }

        // ---------- 点击测试 ----------
        startBtn.addEventListener('click', function() {
            // 收集答案
            const answers = getSelectedAnswers();
            const missing = QUESTIONS.some(q => !answers[q.id]);
            if (missing) {
                alert('🤨 还有问题没选呢！ 认真点～');
                return;
            }

            const birthDate = document.getElementById('birthDate').value;
            if (!birthDate) {
                alert('📅 出生日期是必填的！');
                return;
            }
            const gender = document.getElementById('genderSelect').value;
            const birthTime = document.getElementById('birthTime').value;
            const birthPlace = document.getElementById('birthPlace').value || '未知';

            const data = generateResult(answers, birthDate, gender, birthTime, birthPlace);
            renderResult(data);

            // 额外：滚动到结果
            setTimeout(() => {
                document.querySelector('.result-area').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        });

        // 加上默认选中的问题，方便测试
        document.querySelectorAll('.q-options input[type="radio"]').forEach((el, idx) => {
            if (idx % 4 === 0) el.checked = true;
        });
    })();
</script>
</body>
</html>
