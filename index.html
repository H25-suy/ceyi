<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>你的隐藏星座 · 测一测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 30%, #0b0a1a, #05040b);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 12px 40px;
            color: #f0eaff;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            opacity: 0.3;
            width: var(--size);
            height: var(--size);
        }
        @keyframes twinkle {
            0% { opacity: 0.15; transform: scale(0.9); }
            100% { opacity: 0.9; transform: scale(1.2); }
        }

        .app-container {
            position: relative;
            z-index: 2;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 8px;
        }
        .header h1 {
            font-size: 2.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fbbf24 0%, #a855f7 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }
        .header p {
            color: #c4b5d4;
            font-size: 0.95rem;
            margin-top: 6px;
            border-top: 1px solid #3b2b5a;
            padding-top: 10px;
            display: inline-block;
            padding-left: 20px;
            padding-right: 20px;
        }

        .progress-area {
            background: rgba(30, 20, 50, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 6px 6px 6px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #5b3a8a;
            margin-bottom: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .progress-track {
            flex: 1;
            height: 8px;
            background: #2a1b3e;
            border-radius: 20px;
            margin: 0 12px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fbbf24, #a855f7);
            border-radius: 20px;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-weight: 600;
            font-size: 0.9rem;
            color: #e2d5f5;
            min-width: 55px;
            text-align: right;
        }

        .question-card {
            background: rgba(18, 12, 35, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid #4f3270;
            border-radius: 28px;
            padding: 20px 18px 18px;
            margin-bottom: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            transition: all 0.2s;
        }
        .question-card .q-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: #f2ecff;
            margin-bottom: 14px;
            letter-spacing: 0.3px;
            display: flex;
            align-items: baseline;
            gap: 4px;
            flex-wrap: wrap;
        }
        .question-card .q-title .q-num {
            color: #fbbf24;
            font-weight: 700;
            margin-right: 2px;
        }
        .question-card .q-title .q-text {
            color: #f2ecff;
        }
        .question-card .q-title .q-sub {
            font-size: 0.75rem;
            color: #b8a1d9;
            margin-left: 6px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .options label {
            background: #261b3a;
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid #4d3270;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
            color: #d6c8f0;
        }
        .options label:hover {
            background: #3a2957;
            border-color: #a855f7;
        }
        .options input[type="radio"] {
            accent-color: #fbbf24;
            width: 16px;
            height: 16px;
            transform: scale(1.1);
        }
        .options input[type="radio"]:checked + span {
            color: #fbbf24;
            font-weight: 500;
        }
        .options label:has(input:checked) {
            background: #3a2957;
            border-color: #fbbf24;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
        }
        .input-field {
            background: #1f1435;
            border: 1px solid #4f3270;
            border-radius: 60px;
            padding: 12px 18px;
            width: 100%;
            font-size: 1rem;
            color: #f0eaff;
            outline: none;
            transition: 0.2s;
        }
        .input-field:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 16px rgba(251, 191, 36, 0.15);
        }
        .input-field::placeholder {
            color: #7b689a;
        }
        .inline-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .inline-group .input-field {
            flex: 1;
            min-width: 120px;
        }

        .btn-start {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            width: 100%;
            margin: 20px 0 10px;
            cursor: pointer;
            box-shadow: 0 6px 28px rgba(124, 58, 237, 0.5);
            transition: 0.2s;
            letter-spacing: 1px;
        }
        .btn-start:active {
            transform: scale(0.96);
            box-shadow: 0 2px 12px rgba(124, 58, 237, 0.6);
        }
        .btn-start:disabled {
            opacity: 0.4;
            transform: scale(0.98);
            pointer-events: none;
        }

        .result-container {
            margin-top: 30px;
            background: rgba(12, 8, 28, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 28px 20px;
            border: 1px solid #6a4a94;
            box-shadow: 0 12px 48px rgba(0,0,0,0.8);
            display: none;
        }
        .result-container.show {
            display: block;
            animation: fadeSlide 0.5s ease;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fbbf24, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 18px;
        }
        .result-sub {
            text-align: center;
            color: #bba8d9;
            border-bottom: 1px dashed #4a3270;
            padding-bottom: 16px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .zodiac-badge {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 12px 0 22px;
        }
        .badge-item {
            text-align: center;
        }
        .badge-item .icon {
            font-size: 2.8rem;
            line-height: 1;
            filter: drop-shadow(0 0 8px #a855f7);
        }
        .badge-item .label {
            font-size: 0.8rem;
            color: #b8a1d9;
        }
        .badge-item .value {
            font-weight: 600;
            font-size: 1.1rem;
            color: #f2ecff;
        }

        .trait-block {
            background: #1b1430;
            border-radius: 24px;
            padding: 16px 18px;
            margin: 16px 0;
            border-left: 4px solid #fbbf24;
        }
        .trait-block h4 {
            color: #fbbf24;
            font-size: 1rem;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .trait-block p {
            color: #d6c8f0;
            line-height: 1.6;
            font-size: 0.95rem;
            margin-bottom: 6px;
        }
        .trait-block p:last-child {
            margin-bottom: 0;
        }
        .divider {
            border: none;
            border-top: 1px solid #3f2a5e;
            margin: 18px 0;
        }

        .footnote {
            text-align: center;
            color: #5f4c7a;
            font-size: 0.75rem;
            margin-top: 30px;
            border-top: 1px solid #2e1f44;
            padding-top: 18px;
            letter-spacing: 0.5px;
        }

        .highlight-gold {
            color: #fbbf24;
            font-weight: 500;
        }
        .gold-icon {
            color: #fbbf24;
            filter: drop-shadow(0 0 6px #fbbf24);
            font-weight: 700;
        }
        .gold-final {
            color: #fbbf24;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.8rem; }
            .question-card { padding: 16px; }
            .options label { padding: 6px 14px; font-size: 0.85rem; }
            .badge-item .icon { font-size: 2.2rem; }
            .inline-group .input-field { min-width: 100px; }
        }
    </style>
</head>
<body>
    <div class="stars-container" id="starsContainer"></div>

    <div class="app-container">
        <div class="header">
            <h1>✦ 隐藏星座 ✦</h1>
            <p>15个问题 · 揭开你的星盘真相</p>
        </div>

        <div class="progress-area">
            <span style="color:#d6c8f0; font-size:0.9rem;">⚡</span>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-text" id="progressText">0/15</span>
        </div>

        <form id="quizForm">
            <!-- 出生日期卡片 -->
            <div class="question-card">
                <div class="q-title">
                    <span class="gold-icon">✦</span>
                    <span class="q-text" style="color:#fbbf24; text-shadow:0 0 12px #fbbf24;">出生日期</span>
                    <span class="q-sub" style="color:#f87171;">*必填</span>
                </div>
                <input type="date" class="input-field" id="birthDate" required style="margin-bottom: 10px;">

                <div class="inline-group">
                    <div style="flex:1; min-width:120px; position:relative;">
                        <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); color:#fbbf24; font-size:1.1rem; filter:drop-shadow(0 0 6px #fbbf24);">🕒</span>
                        <input type="time" class="input-field" id="birthTime" placeholder="出生时间 (选填)" style="padding-left: 44px;">
                    </div>
                    <input type="text" class="input-field" id="birthPlace" placeholder="出生地点 (选填)">
                </div>
            </div>

            <!-- 15个问题 -->
            <div id="questionsContainer"></div>

            <button type="button" class="btn-start" id="startBtn">✦ 开始测试 ✦</button>
        </form>

        <div class="result-container" id="resultContainer">
            <div class="result-title">⚡ 你的另一面 ⚡</div>
            <div id="resultContent"></div>
            <div class="footnote">仅供娱乐 · AI生成</div>
        </div>

        <div class="footnote" style="margin-top:10px; border-top: none; padding-top: 0;">对话由 AI 生成</div>
    </div>

    <script>
        (function() {
            // 星星
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = (Math.random() * 3 + 1.5) + 'px';
                star.style.setProperty('--size', size);
                star.style.width = size;
                star.style.height = size;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }

            // ----- 15个问题 -----
            const questions = [
                { id: 'q1', text: '你梦想中的出生地是哪里？', options: ['A. 繁华都市 · 霓虹灯下的不夜城，越夜越精彩', 'B. 安静小镇 · 小桥流水人家，岁月静好如画', 'C. 海边 · 面朝大海，海浪声是最好的白噪音', 'D. 山林 · 森系秘境，与鸟兽为邻，呼吸都是甜的'] },
                { id: 'q2', text: '彩虹里面你最喜欢第几个颜色？', options: ['1', '2', '3', '4', '5', '6', '7'], isNumber: true },
                { id: 'q3', text: '当你遇到无法解决的事情时，你的第一反应是？', options: ['A. 找朋友帮忙 · 一顿饭局解决不了的事，那就两顿', 'B. 自己硬扛 · 咬碎牙往肚子里咽，真正的猛士', 'C. 逃避 · 只要我不看，问题就不存在（虽可耻但有用）', 'D. 冷静分析 · 拿起小本本列个Excel，我命由我不由天'] },
                { id: 'q4', text: '你更相信直觉还是逻辑？', options: ['A. 直觉 · 第六感是我的人生导航，准到离谱', 'B. 逻辑 · 一切皆可推理，但感情面前往往翻车', 'C. 两者结合 · 玄学与科学并重，该信谁看心情'] },
                { id: 'q5', text: '你最喜欢的季节？', options: ['A. 春天 · 百花齐放，连空气都是恋爱的味道', 'B. 夏天 · 烈日骄阳，冰镇西瓜，就该热血沸腾', 'C. 秋天 · 落叶纷飞，文艺青年的标配季节', 'D. 冬天 · 寒风凛冽，围炉夜话，越冷越清醒'] },
                { id: 'q6', text: '你更倾向于独处还是社交？', options: ['A. 独处 · 一个人就是一支队伍，社恐的快乐你不懂', 'B. 社交 · 派对动物本物，没有社交我会枯萎', 'C. 两者平衡 · 可E可I，社交场合的变色龙'] },
                { id: 'q7', text: '你觉得自己最大的优点是？', options: ['A. 善良 · 人间小天使，看到流浪猫都想给它安个家', 'B. 聪明 · 智商在线，脑回路堪比超算中心', 'C. 勇敢 · 天不怕地不怕，敢在雷雨天出门收衣服', 'D. 幽默 · 行走的段子手，朋友圈的快乐源泉'] },
                { id: 'q8', text: '你觉得自己最大的缺点是？', options: ['A. 拖延 · DDL是第一生产力，但心脏真的受不了', 'B. 急躁 · 连等个外卖都要刷新八百遍物流信息', 'C. 敏感 · 别人随口一句话，你能琢磨三天三夜', 'D. 固执 · 撞了南墙也不回头，还想把墙拆了铺路'] },
                { id: 'q9', text: '你更愿意生活在过去、现在还是未来？', options: ['A. 过去 · 活在回忆里的文艺青年，旧时光滤镜拉满', 'B. 现在 · 活在当下，及时行乐才是人生真谛', 'C. 未来 · 梦想家本家，已经在规划下下周的日程了'] },
                { id: 'q10', text: '你最喜欢的动物是？', options: ['A. 猫 · 高冷傲娇，爱你但绝不承认', 'B. 狗 · 忠诚热情，看到你就疯狂摇尾巴', 'C. 狼 · 独行侠本侠，神秘的孤狼气质', 'D. 鹰 · 志存高远，俯瞰众生的天空王者'] },
                { id: 'q11', text: '你面对压力时通常会？', options: ['A. 吃东西 · 没有什么是一顿火锅解决不了的，有就两顿', 'B. 运动 · 暴汗解压，多巴胺比爱情还靠谱', 'C. 睡觉 · 一睡解千愁，梦里什么都有', 'D. 找人倾诉 · 把朋友当树洞，吐槽完神清气爽'] },
                { id: 'q12', text: '你更看重爱情还是事业？', options: ['A. 爱情 · 恋爱脑晚期，但甘之如饴', 'B. 事业 · 搞钱要紧，爱情可以等一等', 'C. 两者平衡 · 既要面包又要玫瑰，成年人全都要'] },
                { id: 'q13', text: '你相信命运吗？', options: ['A. 相信 · 一切都是最好的安排，躺平也是种智慧', 'B. 不相信 · 我命由我不由天，人定胜天', 'C. 半信半疑 · 信则有不信则无，看情况玄学一下'] },
                { id: 'q14', text: '用一句话描述你自己', options: [], isText: true, placeholder: '一句话，够了...' },
                { id: 'q15', text: '如果你给自己取一个名字，你会选择什么名字？', options: [], isText: true, placeholder: '例如：星辰、夜岚...' }
            ];

            // 渲染问题
            const containerQ = document.getElementById('questionsContainer');
            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.dataset.qid = q.id;

                let optionsHtml = '';
                if (q.isText) {
                    optionsHtml = `<input type="text" class="input-field" id="${q.id}" placeholder="${q.placeholder || '输入你的答案...'}" style="margin-top:4px;">`;
                } else if (q.isNumber) {
                    q.options.forEach(opt => {
                        optionsHtml += `
                            <label>
                                <input type="radio" name="${q.id}" value="${opt}">
                                <span>${opt}</span>
                            </label>
                        `;
                    });
                } else {
                    q.options.forEach(opt => {
                        optionsHtml += `
                            <label>
                                <input type="radio" name="${q.id}" value="${opt}">
                                <span>${opt}</span>
                            </label>
                        `;
                    });
                }

                card.innerHTML = `
                    <div class="q-title">
                        <span class="q-num">${index+1}.</span>
                        <span class="q-text">${q.text}</span>
                    </div>
                    <div class="options">${optionsHtml}</div>
                `;
                containerQ.appendChild(card);
            });

            // 获取答案
            function getAnswers() {
                const answers = {};
                questions.forEach(q => {
                    if (q.isText) {
                        const el = document.getElementById(q.id);
                        answers[q.id] = el ? el.value.trim() : '';
                    } else {
                        const selected = document.querySelector(`input[name="${q.id}"]:checked`);
                        answers[q.id] = selected ? selected.value : '';
                    }
                });
                return answers;
            }

            // 更新进度
            function updateProgress() {
                const ans = getAnswers();
                let count = 0;
                questions.forEach(q => {
                    const val = ans[q.id];
                    if (val && val.length > 0) count++;
                });
                const birthDate = document.getElementById('birthDate').value;
                if (birthDate) count++;

                const total = questions.length + 1;
                const pct = Math.min(100, Math.round((count / total) * 100));
                document.getElementById('progressFill').style.width = pct + '%';
                document.getElementById('progressText').textContent = `${Math.min(count, total)}/${total}`;
            }

            document.querySelectorAll('input, textarea, select').forEach(el => {
                el.addEventListener('change', updateProgress);
                el.addEventListener('input', updateProgress);
            });
            updateProgress();

            // ----- 星座计算 -----
            function getSunSign(month, day) {
                const signs = [
                    [1,20,'♒ 水瓶座'],[2,19,'♓ 双鱼座'],[3,21,'♈ 白羊座'],[4,20,'♉ 金牛座'],
                    [5,21,'♊ 双子座'],[6,21,'♋ 巨蟹座'],[7,23,'♌ 狮子座'],[8,23,'♍ 处女座'],
                    [9,23,'♎ 天秤座'],[10,24,'♏ 天蝎座'],[11,23,'♐ 射手座'],[12,22,'♑ 摩羯座']
                ];
                for (let i = 0; i < signs.length; i++) {
                    if ((month === signs[i][0] && day >= signs[i][1]) || (month === signs[i][0]+1 % 12)) {
                        return signs[i][2];
                    }
                }
                return '♑ 摩羯座';
            }

            function getMoonSign(month, day) {
                const map = [
                    [1,20,'♋ 巨蟹座'],[2,19,'♌ 狮子座'],[3,21,'♍ 处女座'],[4,20,'♎ 天秤座'],
                    [5,21,'♏ 天蝎座'],[6,21,'♐ 射手座'],[7,23,'♑ 摩羯座'],[8,23,'♒ 水瓶座'],
                    [9,23,'♓ 双鱼座'],[10,24,'♈ 白羊座'],[11,23,'♉ 金牛座'],[12,22,'♊ 双子座']
                ];
                for (let i = 0; i < map.length; i++) {
                    if ((month === map[i][0] && day >= map[i][1]) || (month === map[i][0]+1 % 12)) {
                        return map[i][2];
                    }
                }
                return '♊ 双子座';
            }

            function getRisingSign(timeStr) {

                const descItems = getRandomItems(CAREER_DESC_POOL, 2);
                const careerDesc = descItems.join(' ');

                // 随机名言
                const quote = getRandomQuote();

                return {
                    sunSign,
                    moonSign,
                    risingSign,
                    hiddenSign,
                    traitLines,
                    darkLines,
                    emotionLines,
                    careerLines: careerList,
                    careerDesc,
                    quote
                };
            }

            // 点击测试
            document.getElementById('startBtn').addEventListener('click', function() {
                const birthDate = document.getElementById('birthDate').value;
                if (!birthDate) {
                    alert('请填写出生日期 (必填)');
                    return;
                }
                const answers = getAnswers();
                let filled = 0;
                for (let key in answers) {
                    if (answers[key] && answers[key].length > 0) filled++;
                }
                if (filled < 3) {
                    alert('请至少回答几个问题，让星盘更准确 ✦');
                    return;
                }

                const birthTime = document.getElementById('birthTime').value;
                const birthPlace = document.getElementById('birthPlace').value;
                const report = generateReport(birthDate, birthTime, birthPlace, answers);
                displayResult(report);
            });

            function displayResult(report) {
                const container = document.getElementById('resultContainer');
                const content = document.getElementById('resultContent');
                container.classList.add('show');

                const { sunSign, moonSign, risingSign, hiddenSign, traitLines, darkLines, emotionLines, careerLines, careerDesc, quote } = report;

                const traitsHtml = traitLines.map(line => `<p>${line}</p>`).join('');
                const darkHtml = darkLines.map(line => `<p>${line}</p>`).join('');
                const emotionHtml = emotionLines.map(line => `<p>${line}</p>`).join('');
                const careerItems = careerLines.map(c => `<span style="display:inline-block; background:#2a1b46; padding:4px 16px; border-radius:20px; margin:4px 6px 4px 0; border:1px solid #5b3a8a; color:#fbbf24;">${c}</span>`).join('');

                content.innerHTML = `
                    <div class="result-sub">面具之下的你，远比想象中复杂</div>
                    <div class="zodiac-badge">
                        <div class="badge-item"><div class="icon">☀️</div><div class="label">太阳星座</div><div class="value">${sunSign}</div></div>
                        <div class="badge-item"><div class="icon">🌙</div><div class="label">月亮星座</div><div class="value">${moonSign}</div></div>
                        <div class="badge-item"><div class="icon">⬆️</div><div class="label">上升星座</div><div class="value">${risingSign}</div></div>
                    </div>
                    <div style="text-align:center; margin: 4px 0 14px; font-size:1.3rem; background: #2a1b46; padding:8px; border-radius:60px;">
                        <span class="highlight-gold">✦ 隐藏星座：${hiddenSign} ✦</span>
                    </div>

                    <div class="trait-block"><h4>🔮 你的另一面</h4>
                        ${traitsHtml}
                    </div>

                    <div class="trait-block" style="border-left-color:#a855f7;"><h4>🌓 阴影面</h4>
                        ${darkHtml}
                    </div>

                    <div class="trait-block" style="border-left-color:#fbbf24;"><h4>💼 适合的职业方向</h4>
                        <div style="margin-bottom:10px;">${careerItems}</div>
                        <p style="color:#d6c8f0;">${careerDesc}</p>
                    </div>

                    <div class="trait-block" style="border-left-color:#c084fc;"><h4>❤️ 情感模式</h4>
                        ${emotionHtml}
                    </div>

                    <hr class="divider">
                    <p style="color:#b8a1d9; font-size:0.95rem; text-align:center; font-style:italic;">${quote.cn}</p>
                    <p style="color:#8b75a8; font-size:0.85rem; text-align:center; margin-top:4px;">${quote.en}</p>
                    <p style="text-align:center; margin-top:14px; font-size:1.2rem; letter-spacing:1px;">
                        <span class="gold-final">✦ Know thyself. ✦</span>
                    </p>
                `;
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        })();
    </script>
</body>
</html>
